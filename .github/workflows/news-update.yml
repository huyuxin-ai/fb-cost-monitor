name: 原材料新闻更新与站点部署

on:
  schedule:
    # GitHub Actions 使用 UTC；每30分钟检查一次新新闻
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

concurrency:
  group: fb-cost-monitor-data-update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 测试原材料新闻筛选规则
        run: python3 pipeline/test_news_filter.py

      - name: 抓取并筛选原材料相关新闻
        id: collect_news
        continue-on-error: true
        run: python3 pipeline/collect_news.py

      - name: 采集失败时恢复上一版新闻
        if: steps.collect_news.outcome == 'failure'
        run: |
          echo "::warning::本轮新闻采集失败，保留上一版新闻，不提交也不部署空数据。"
          git restore --source=HEAD --worktree -- pipeline/news_archive.json public/data/news.json

      - name: 新闻数据校验
        run: |
          python3 - <<'EOF'
          import json
          import sys

          sys.path.insert(0, 'pipeline')
          from news_filter import load_news_config, validate_public_feed

          cfg = load_news_config()
          with open('public/data/news.json', encoding='utf-8') as f:
              feed = json.load(f)
          assert len(cfg['materials']) == 34, '新闻原材料字典不是34项'
          assert feed.get('refresh_minutes') == 30, '新闻刷新频率异常'
          assert feed.get('item_count') == len(feed.get('items', [])), '新闻条数统计不一致'
          assert feed.get('items'), '新闻列表为空'
          assert sum(feed.get('source_counts', {}).values()) == len(feed['items']), '新闻来源统计不一致'
          validate_public_feed(feed, cfg, set(cfg['materials']))
          print('新闻校验通过:', feed['item_count'], '条')
          EOF

      - name: 检查新闻是否真的有变化
        id: news_changes
        run: |
          if git diff --quiet -- pipeline/news_archive.json public/data/news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "没有新的相关新闻，本轮不提交、不部署。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到新的相关新闻，继续提交和部署。"
          fi

      - name: 报告全部新闻源失败
        if: steps.collect_news.outcome == 'failure'
        run: |
          echo "所有新闻源都失败，旧数据已保留，本次任务标记为失败以便排查。"
          exit 1

      - name: 在本地准备新闻提交
        if: steps.news_changes.outputs.changed == 'true'
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add pipeline/news_archive.json public/data/news.json
          git commit -m "news: 更新原材料资讯 $(date -u +%F-%H%M)"

      - name: 同步远程最新版本
        run: |
          git pull --rebase origin "$GITHUB_REF_NAME"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 构建前端
        run: npm ci --no-audit --no-fund && npm run build

      - name: 推送已通过构建的新闻更新
        if: steps.news_changes.outputs.changed == 'true'
        run: |
          git push origin "HEAD:$GITHUB_REF_NAME"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
