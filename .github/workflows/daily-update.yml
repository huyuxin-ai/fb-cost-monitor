name: 数据更新与站点部署

on:
  schedule:
    # 每交易日 16:30 CST = 08:30 UTC
    - cron: '30 8 * * 1-5'
  push:
    branches: [master, main]
    paths-ignore:
      - pipeline/news_archive.json
      - public/data/news.json
  workflow_dispatch: {}

concurrency:
  group: fb-cost-monitor-data-update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装数据依赖
        run: pip install akshare pandas openpyxl numpy

      - name: 采集最新数据（首次运行自动自举全年历史）
        run: python3 pipeline/collect_daily.py

      - name: 成员采集数据入库（inbox 自动验收合并）
        run: python3 pipeline/ingest_inbox.py

      - name: 测试原材料新闻筛选规则
        run: python3 pipeline/test_news_filter.py

      - name: 校验同伴净利润敏感性结果
        run: python3 pipeline/test_profit_sensitivity.py

      - name: 更新原材料相关新闻
        id: collect_news
        continue-on-error: true
        run: python3 pipeline/collect_news.py

      - name: 新闻采集失败时保留上一版
        if: steps.collect_news.outcome == 'failure'
        run: |
          echo "::warning::本轮新闻采集失败，继续使用仓库中上一版新闻。"
          git restore --source=HEAD --worktree -- pipeline/news_archive.json public/data/news.json

      - name: 新闻数据校验
        run: |
          python3 - <<'EOF'
          import json
          import sys

          sys.path.insert(0, 'pipeline')
          from news_filter import load_news_config, validate_public_feed

          cfg = load_news_config()
          with open('public/data/news.json', encoding='utf-8') as f:
              feed = json.load(f)
          assert len(cfg['materials']) == 34, '新闻原材料字典不是34项'
          assert feed.get('refresh_minutes') == 30, '新闻刷新频率异常'
          assert feed.get('item_count') == len(feed.get('items', [])), '新闻条数统计不一致'
          assert feed.get('items'), '新闻列表为空'
          assert sum(feed.get('source_counts', {}).values()) == len(feed['items']), '新闻来源统计不一致'
          validate_public_feed(feed, cfg, set(cfg['materials']))
          print('新闻校验通过:', feed['item_count'], '条')
          EOF

      - name: 周度聚合+异动检测+重建 app_data.json
        run: python3 pipeline/build_data.py

      - name: 数据完整性校验
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('public/data/app_data.json'))
          assert len(d['materials']) == 34, '品种数异常（应为34项）'
          assert all(m['series'] and m['latest'] for m in d['materials']), '存在无历史价格的品种'
          material_ids = {m['id'] for m in d['materials']}
          assert len(material_ids) == len(d['materials']), '品种代码重复'
          assert all(s['material'] in material_ids for s in d['sensitivity']), '存在无效敏感度映射'
          assert len(d.get('profit_sensitivity', [])) == 25, '同伴净利润敏感性结果数量异常'
          tag_pairs = {
              (m['id'], downstream['code'])
              for m in d['materials']
              for downstream in m.get('downstream', [])
          }
          assert all(
              (s['material'], s['company']) in tag_pairs
              for s in d['profit_sensitivity']
          ), '同伴敏感性存在无法点击的公司标签'
          internal_fields = {
              'source_row', 'formula', 'calculation_status', 'quality_flags',
              'calculation_note', 'source_calculation_note', 'source_company_name', 'source_level',
          }
          assert all(
              not (internal_fields & set(s))
              for s in d['profit_sensitivity']
          ), '客户数据包含内部复核字段'
          assert len(d['companies']) >= 150, '公司数异常'
          print('数据校验通过:', d['data_week'])
          EOF

      - name: 在本地准备数据提交
        id: data_changes
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add public/data/*.json public/data/*.csv pipeline/config.json pipeline/news_archive.json pipeline/inbox/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "本轮数据没有变化，不创建空提交。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -m "data: 每日更新 $(date +%F)"
          fi

      - name: 同步远程最新版本
        run: git pull --rebase origin "$GITHUB_REF_NAME"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 构建前端
        run: npm ci --no-audit --no-fund && npm run build

      - name: 推送已通过构建的数据更新
        if: steps.data_changes.outputs.changed == 'true'
        run: git push origin "HEAD:$GITHUB_REF_NAME"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
